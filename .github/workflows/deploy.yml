name: deploy
# Runs on the runner installed on Liessure's own LXC. Never add pull_request here.
#
# Settings and secrets live on the box in /opt/liessure/.env (0600, runner),
# written by the deploy-worker plan that created the CT and edited by hand
# after. Compose reads it for ${VAR} interpolation. Nothing comes from GitHub
# variables or secrets: an unset GitHub variable is an empty string, and an
# empty string in the job's environment would override the .env value.
on:
  push:
    branches: [main]
    paths-ignore: ["android/**", "**.md", "docs/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, liessure-r7]
    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        run: |
          test -f /opt/liessure/.env || { echo "::error::/opt/liessure/.env is missing"; exit 1; }
          # Say which sources are switched off, without printing any value.
          for k in JELLYFIN_TOKEN IMMICH_API_KEY ROMM_TOKEN INVIDIOUS_WATCH_TOKEN LLM_KEY TRAVEL_TOKEN GRAPH_TOKEN; do
            grep -q "^$k=." /opt/liessure/.env || echo "::warning::$k is empty in /opt/liessure/.env"
          done

      - name: Sync to /opt/liessure
        # .env is the box's own; never delete or overwrite it.
        run: rsync -a --delete --exclude .git --exclude android --exclude .env ./ /opt/liessure/

      - name: Build and start
        working-directory: /opt/liessure
        run: docker compose up -d --build --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/healthz && exit 0
            sleep 2
          done
          docker compose -f /opt/liessure/docker-compose.yml logs --tail 50
          exit 1

      - name: Prune
        run: docker image prune -f
