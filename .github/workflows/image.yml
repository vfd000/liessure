name: image
# Builds the Liessure image on every change to the app and publishes it to
# ghcr.io/vfd000/liessure (public package: the image holds code, never
# secrets). CT 163 deploys each new :latest by itself within a few minutes
# (deploy/autodeploy/, health-checked, rolled back on failure). A change to
# docker-compose.yml still goes out with deploy/build-release-plan.sh, using
# the digest printed in this run's summary.
on:
  push:
    branches: [main]
    paths: ["app/**", "Dockerfile", "requirements.txt", ".github/workflows/image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/vfd000/liessure:${{ github.sha }}
            ghcr.io/vfd000/liessure:latest
          labels: |
            org.opencontainers.image.source=https://github.com/vfd000/liessure
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Digest
        run: |
          echo "LIESSURE_IMAGE=ghcr.io/vfd000/liessure@${{ steps.build.outputs.digest }}"
          {
            echo "### Release this build"
            echo '```'
            echo "bash deploy/build-release-plan.sh ghcr.io/vfd000/liessure@${{ steps.build.outputs.digest }} ${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
