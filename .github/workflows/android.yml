name: android
on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write   # publishes the "android-latest" release on main
jobs:
  apk:
    # GitHub-hosted on purpose: PR builds must never reach the self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key (main only, if configured)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.DETOUR_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/detour.jks"
            echo "DETOUR_KEYSTORE_PATH=$RUNNER_TEMP/detour.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::DETOUR_KEYSTORE_B64 not set; APK is debug-signed and each build will need an uninstall to update."
          fi

      - name: Build
        working-directory: android
        env:
          DETOUR_KEYSTORE_PASSWORD: ${{ secrets.DETOUR_KEYSTORE_PASSWORD }}
          DETOUR_KEY_ALIAS: ${{ secrets.DETOUR_KEY_ALIAS }}
          DETOUR_KEY_PASSWORD: ${{ secrets.DETOUR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: detour-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish android-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk detour.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest detour.apk \
            --title "Detour for Android (build ${GITHUB_RUN_NUMBER})" \
            --notes "Built from ${GITHUB_SHA}." --latest
