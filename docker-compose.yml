# Liessure in /opt/liessure on its own CT (163 on wtr).
#
# The image is built by .github/workflows/image.yml and published to
# ghcr.io/vfd000/liessure. A deploy-worker release plan (deploy/build-release-plan.sh)
# pins it by digest: it sets LIESSURE_IMAGE=ghcr.io/vfd000/liessure@sha256:...
# in /opt/liessure/.env, then `docker compose pull && up -d`.
#
# Every setting and secret comes from /opt/liessure/.env (0600), which lives
# only on the box. Locally: `docker compose up --build` with your own .env.
services:
  liessure:
    image: ${LIESSURE_IMAGE:-liessure:local}
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - liessure-data:/data   # curated pool + open/play history (SQLite)

volumes:
  liessure-data:
