<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <title>Liessure</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1>Liessure</h1>
    <button id="refresh" class="icon" aria-label="New feed" title="New feed">↻</button>
  </header>
  <div id="banner" class="banner" hidden>You were heading to Reddit. Here's something of yours instead.</div>
  <nav id="chips" class="chips" aria-label="Filter"></nav>
  <main id="feed" class="feed" aria-live="polite"></main>
  <div id="sentinel" class="sentinel"><span class="spinner"></span></div>
  <script src="/app.js"></script>
</body>
</html>
